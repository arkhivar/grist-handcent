name: SMS → Grist sync

on:
  repository_dispatch:
    types: [sms-sync]
  workflow_dispatch:
    inputs:
      cid:
        description: "Conversation: 276 / 277 / 0321 / 900 / all"
        required: false
        default: "all"
        type: string
  # Safety net while the phone-side repository_dispatch trigger is being
  # tested. This schedule burns Actions minutes (~500–900 min/month); DELETE
  # this block once dispatch proves stable.
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: sms-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # The run+upload step lives in .github/actions/sms-sync-run so the
      # artifact upload (public repo) is structurally separated from secret
      # handling; the engine never puts credential values in the artifact.
      - name: Run sync + upload artifact
        uses: ./.github/actions/sms-sync-run
        with:
          sync_cid: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.cid || 'all') || (github.event_name == 'workflow_dispatch' && inputs.cid || 'all') }}
          handcent_auth: ${{ secrets.HANDCENT_AUTH }}
          grist_key: ${{ secrets.GRIST_API_KEY }}
          # Target table id — set a repo Variable named GRIST_TABLE to override
          # without a code change; engine default is "Transactions".
          grist_table: ${{ vars.GRIST_TABLE || 'Transactions' }}
